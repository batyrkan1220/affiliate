<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Teliks — админка сети</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="adm">
  <header class="adm-top">
    <div class="adm-top-in">
      <a class="adm-brand" href="/admin.html">Teliks <span>сеть</span></a>
      <nav class="adm-tabs" role="tablist" aria-label="Разделы">
        <button type="button" role="tab" data-tab="overview" aria-selected="true">Обзор</button>
        <button type="button" role="tab" data-tab="partners" aria-selected="false">Партнёры</button>
        <button type="button" role="tab" data-tab="payouts" aria-selected="false">Выплаты <span class="adm-count" id="cnt-proc"></span></button>
        <button type="button" role="tab" data-tab="conversions" aria-selected="false">Конверсии</button>
      </nav>
      <a class="adm-back" href="/#/account">Кабинет →</a>
    </div>
  </header>
  <main class="adm-main">
    <div class="adm-bar">
      <div class="adm-period" role="group" aria-label="Период">
        <button class="chip" type="button" data-days="1" aria-pressed="false">Сегодня</button>
        <button class="chip" type="button" data-days="7" aria-pressed="false">7 дней</button>
        <button class="chip" type="button" data-days="30" aria-pressed="true">30 дней</button>
        <button class="chip" type="button" data-days="90" aria-pressed="false">90 дней</button>
        <label class="adm-date"><span class="sr">С</span><input type="date" id="from" class="input"></label>
        <label class="adm-date"><span class="sr">По</span><input type="date" id="to" class="input"></label>
      </div>
      <span class="adm-muted" id="updated"></span>
    </div>
    <p class="error" id="err" role="alert"></p>
    <section id="view" aria-live="polite"><p class="adm-muted">Загрузка…</p></section>
  </main>
  <div class="adm-drawer" id="drawer" hidden>
    <div class="adm-drawer-bg" data-close></div>
    <aside class="adm-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dr-title">
      <button class="btn btn-icon adm-close" type="button" data-close aria-label="Закрыть">✕</button>
      <div id="drawer-body"></div>
    </aside>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
